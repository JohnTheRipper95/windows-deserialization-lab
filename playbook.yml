---
- name: Compilar ysoserial.net en Windows
  hosts: windows
  gather_facts: false

  vars:
    source_zip: 'C:\vagrant\files\ysoserial.zip'
    build_root: 'C:\build'
    source_dir: 'C:\build\ysoserial.net'
    solution_file: 'C:\build\ysoserial.net\ysoserial.sln'
    msbuild_exe: 'C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe'

  tasks:
    - name: Comprobar que existe el ZIP compartido
      ansible.windows.win_stat:
        path: "{{ source_zip }}"
      register: zip_status

    - name: Detener si no existe el ZIP
      ansible.builtin.fail:
        msg: "No se encontró {{ source_zip }}"
      when: not zip_status.stat.exists

    - name: Instalar Chocolatey
      ansible.windows.win_shell: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = `
          [System.Net.ServicePointManager]::SecurityProtocol -bor 3072

        if (-not (Test-Path 'C:\ProgramData\chocolatey\bin\choco.exe')) {
          iex ((New-Object System.Net.WebClient).DownloadString(
            'https://community.chocolatey.org/install.ps1'
          ))
        }
      args:
        executable: powershell.exe

    - name: Instalar Visual Studio Community
      chocolatey.chocolatey.win_chocolatey:
        name: visualstudio2022community
        state: present

    - name: Instalar workload nativedesktop
      chocolatey.chocolatey.win_chocolatey:
        name: visualstudio2022-workload-nativedesktop
        state: present

    - name: Instalar MSBuild Community Tasks
      chocolatey.chocolatey.win_chocolatey:
        name: msbuild.communitytasks
        state: present

    - name: Instalar NuGet
      chocolatey.chocolatey.win_chocolatey:
        name: nuget.commandline
        state: present

    - name: Crear directorio de compilación
      ansible.windows.win_file:
        path: "{{ build_root }}"
        state: directory

    - name: Limpiar código anterior
      ansible.windows.win_file:
        path: "{{ source_dir }}"
        state: absent

    - name: Crear directorio fuente
      ansible.windows.win_file:
        path: "{{ source_dir }}"
        state: directory

    - name: Descomprimir código fuente
      ansible.windows.win_shell: |
        Expand-Archive `
          -Path "{{ source_zip }}" `
          -DestinationPath "{{ source_dir }}" `
          -Force
      args:
        executable: powershell.exe

    - name: Localizar ysoserial.sln
      ansible.windows.win_find:
        paths:
          - "{{ source_dir }}"
        patterns:
          - ysoserial.sln
        recurse: true
      register: solution_search

    - name: Mostrar solución encontrada
      ansible.builtin.debug:
        msg: "{{ solution_search.files | map(attribute='path') | list }}"

    - name: Detener si no se encuentra la solución
      ansible.builtin.fail:
        msg: "No se encontró ysoserial.sln dentro de {{ source_dir }}"
      when: solution_search.matched | int == 0

    - name: Restaurar paquetes NuGet
      ansible.windows.win_command:
        argv:
          - nuget
          - restore
          - "{{ solution_search.files[0].path }}"

    - name: Comprobar que existe MSBuild
      ansible.windows.win_stat:
        path: "{{ msbuild_exe }}"
      register: msbuild_status

    - name: Detener si no se encuentra MSBuild
      ansible.builtin.fail:
        msg: "No se encontró MSBuild en {{ msbuild_exe }}"
      when: not msbuild_status.stat.exists

    - name: Compilar ysoserial.net
      ansible.windows.win_command:
        argv:
          - "{{ msbuild_exe }}"
          - "{{ solution_search.files[0].path }}"
          - /p:Configuration=Release

    - name: Buscar ysoserial.exe
      ansible.windows.win_find:
        paths:
          - "{{ source_dir }}"
        patterns:
          - ysoserial.exe
        recurse: true
      register: executable_search

    - name: Mostrar ejecutables generados
      ansible.builtin.debug:
        msg: "{{ executable_search.files | map(attribute='path') | list }}"

    - name: Ejecutar ayuda de ysoserial.net
      ansible.windows.win_command:
        argv:
          - "{{ executable_search.files[0].path }}"
          - -h
      register: help_output
      changed_when: false
      when: executable_search.matched | int > 0

    - name: Mostrar ayuda
      ansible.builtin.debug:
        var: help_output.stdout_lines
      when: executable_search.matched | int > 0
