---
- name: Deploy precompiled ysoserial.net on Windows
  hosts: windows
  gather_facts: false

  vars:
    source_zip: 'C:\Windows\Temp\ysoserial.zip'
    deploy_root: 'C:\opt'
    source_dir: 'C:\opt\ysoserial.net'
    executable_dir: 'C:\opt\ysoserial.net\Release'
    executable_path: 'C:\opt\ysoserial.net\Release\ysoserial.exe'

  tasks:
    - name: Check that the uploaded ZIP exists
      ansible.windows.win_stat:
        path: "{{ source_zip }}"
      register: zip_status

    - name: Stop if the ZIP is missing
      ansible.builtin.fail:
        msg: "The ZIP file was not found: {{ source_zip }}"
      when: not zip_status.stat.exists

    - name: Create the tools directory
      ansible.windows.win_file:
        path: "{{ deploy_root }}"
        state: directory

    - name: Remove the previous deployment
      ansible.windows.win_file:
        path: "{{ source_dir }}"
        state: absent

    - name: Create the deployment directory
      ansible.windows.win_file:
        path: "{{ source_dir }}"
        state: directory

    - name: Extract the precompiled distribution
      ansible.windows.win_shell: |
        Expand-Archive `
          -Path "{{ source_zip }}" `
          -DestinationPath "{{ source_dir }}" `
          -Force
      args:
        executable: powershell.exe

    - name: Add ysoserial.net to the system PATH
      ansible.windows.win_path:
        elements:
          - "{{ executable_dir }}"
        scope: machine

    - name: Notify Windows processes that the environment changed
      ansible.windows.win_shell: |
        Add-Type @'
        using System;
        using System.Runtime.InteropServices;
        public static class NativeMethods {
          [DllImport("user32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
          public static extern IntPtr SendMessageTimeout(
            IntPtr hWnd,
            uint Msg,
            UIntPtr wParam,
            string lParam,
            uint fuFlags,
            uint uTimeout,
            out UIntPtr lpdwResult);
        }
        '@
        $result = [UIntPtr]::Zero
        $broadcast = [IntPtr]0xffff
        $settingChange = 0x001A
        $sendMessageTimeout = 0x0002
        [void][NativeMethods]::SendMessageTimeout(
          $broadcast,
          $settingChange,
          [UIntPtr]::Zero,
          'Environment',
          $sendMessageTimeout,
          5000,
          [ref]$result)
      args:
        executable: powershell.exe
      changed_when: false

    - name: Check that ysoserial.exe exists
      ansible.windows.win_stat:
        path: "{{ executable_path }}"
      register: executable_status

    - name: Show the deployed executable
      ansible.builtin.debug:
        msg: "{{ executable_path }}"

    - name: Fail if ysoserial.exe is missing
      ansible.builtin.fail:
        msg: "The precompiled ysoserial.exe was not found at {{ executable_path }}"
      when: not executable_status.stat.exists

    - name: Run the ysoserial.net help command
      ansible.windows.win_command:
        argv:
          - "{{ executable_path }}"
          - -h
      register: help_output
      changed_when: false

    - name: Show the help output
      ansible.builtin.debug:
        var: help_output.stdout_lines