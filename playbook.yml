---
- name: Desplegar ysoserial.net precompilado en Windows
  hosts: windows
  gather_facts: false

  vars:
    windows_hostname: 'windows-deserialization-lab'
    source_zip: 'C:\vagrant\files\ysoserial.zip'
    deploy_root: 'C:\opt'
    source_dir: 'C:\opt\ysoserial.net'
    executable_dir: 'C:\opt\ysoserial.net\Release'
    executable_path: 'C:\opt\ysoserial.net\Release\ysoserial.exe'

  tasks:
    - name: Configurar hostname del laboratorio
      ansible.windows.win_hostname:
        name: "{{ windows_hostname }}"
      register: hostname_status

    - name: Reiniciar Windows después de cambiar el hostname
      ansible.windows.win_reboot:
        msg: "Reinicio requerido para aplicar el hostname del laboratorio"
      when: hostname_status.reboot_required

    - name: Comprobar que existe el ZIP compartido
      ansible.windows.win_stat:
        path: "{{ source_zip }}"
      register: zip_status

    - name: Detener si no existe el ZIP
      ansible.builtin.fail:
        msg: "No se encontró {{ source_zip }}"
      when: not zip_status.stat.exists

    - name: Crear directorio de herramientas
      ansible.windows.win_file:
        path: "{{ deploy_root }}"
        state: directory

    - name: Limpiar código anterior
      ansible.windows.win_file:
        path: "{{ source_dir }}"
        state: absent

    - name: Crear directorio fuente
      ansible.windows.win_file:
        path: "{{ source_dir }}"
        state: directory

    - name: Descomprimir distribución precompilada
      ansible.windows.win_shell: |
        Expand-Archive `
          -Path "{{ source_zip }}" `
          -DestinationPath "{{ source_dir }}" `
          -Force
      args:
        executable: powershell.exe

    - name: Agregar ysoserial.net al PATH del sistema
      ansible.windows.win_path:
        elements:
          - "{{ executable_dir }}"
        scope: machine

    - name: Comprobar que existe ysoserial.exe
      ansible.windows.win_stat:
        path: "{{ executable_path }}"
      register: executable_status

    - name: Mostrar ejecutable desplegado
      ansible.builtin.debug:
        msg: "{{ executable_path }}"

    - name: Fallar si no se encuentra ysoserial.exe
      ansible.builtin.fail:
        msg: "No se encontró ysoserial.exe precompilado en {{ executable_path }}"
      when: not executable_status.stat.exists

    - name: Ejecutar ayuda de ysoserial.net
      ansible.windows.win_command:
        argv:
          - "{{ executable_path }}"
          - -h
      register: help_output
      changed_when: false

    - name: Mostrar ayuda
      ansible.builtin.debug:
        var: help_output.stdout_lines